<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img">
<defs>
  <linearGradient id="nebula" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101C36"/><stop offset=".55" stop-color="#070D1D"/><stop offset="1" stop-color="#100F2B"/></linearGradient>
  <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#52E5F9"/><stop offset=".52" stop-color="#67E9C7"/><stop offset="1" stop-color="#A18CFF"/></linearGradient>
